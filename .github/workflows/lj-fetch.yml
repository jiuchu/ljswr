# 爱奇艺 / 德塔文 / 云合 / 抖音指数 —— 两京十五日（CVB 那家在青龙跑，理由见步骤里那段注释）
#
# 前置（一次性，都在 GitHub 网页上设）：
#   1. Settings → Actions → General → Workflow permissions → Read and write
#   2. 本文件放 .github/workflows/ 下，fetch_iqiyi.mjs、fetch_detawen.mjs、fetch_yunhe.mjs、
#      fetch_douyin.mjs 和 index.html 放同一个仓库根（脚本把 json 写在**自己旁边**，挪目录要一起挪）；
#      fetch_cvb.mjs 也在仓库根，但这条工作流不跑它 —— 它是手机不在家时在电脑上手补 cvb.json 的那份
#   3. 前三家全匿名、不要 secret。抖音指数那一口要一个 secret：DY_COOKIE ——
#      抖音创作者中心（creator.douyin.com）登录状态下的 cookie，整串贴进去。
#      没建这个 secret 时那一步会红，但不拖另外三家（continue-on-error）。
#
# 为什么四个源挤一条工作流、一个 job：它们都是「读一发、写一份档案」，没有谁需要
# 无头浏览器；拆成四个 job 就是四次 checkout、四份档案各自往 main 推，同仓并发推送
# 那个 1~4 秒的撞车窗口（嫁金钗 10-20 21:31 那次红叉）会被我自己造出来。一个 job
# 里顺序跑四步、最后一次 commit 推四个文件，从根上不会撞自己。
#
# 节拍不在这里，在 Worker 的 Settings → Triggers 页上（cron 是 UTC）。下面这两格
# schedule 只当备份：GitHub 的定时事件从他这个账号整个停了，真正敲门的是 Worker
# 拿 repository_dispatch 叫这条。
#
# 一天两拍（北京 09:30 / 21:30）的理由：德塔文当日榜是傍晚之后才落的，09:30 那拍
# 拿到的是昨天的收盘；云合榜 T+1，早上那拍正好接住它新出的一天；爱奇艺更新时间表
# 一天里会改口（改档、加更），两拍够看住它。抖音指数的尾巴固定在 T-2，一天之内不会
# 变两次，所以两拍对它只是「早拍到就晚拍当重试」，请求数 2 发/天。
#
# ⚠ 第一次跑带着实验性质，各家各自可能红：
#   爱奇艺那条接口带的是脚本里写死的假 device_id，机房 IP 认不认没验过 —— 红了先看
#     日志里那句是「接口回 code」还是 HTTP 层；
#   德塔文那台站点只有 http、HTTPS 握手不通，Actions 里同样走 http，被运营商或
#     GitHub 网络侧拦下来的话是 HTTP 层报错，不是数据问题；
#   云合榜 T+1，开播当天必然「榜内没有本剧」，那是它自己没出，脚本按未收录写、rc=0；
#   抖音指数那一口只认登录 cookie：过期会回 401/403，日志印「登录态不认」，那是凭证的事，
#     要重新贴一次 DY_COOKIE；机房 IP 会不会被风控同样没验过，红了先分清是 HTTP 层还是
#     「回的是页面」（后者多半是被跳去登录或人机）。钥匙表若被换，日志印
#     「x-encrypted=N，这把钥匙表里没有」，那时才需要回去看那份公开实现更新没更新。

name: lj-fetch

on:
  schedule:
    - cron: '30 1,13 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lj-fetch
  # 这里不能写 cancel-in-progress: true：闹钟延迟和手点撞在同一分钟时，
  # 后一发会把正在跑的前一发掐掉，而前一发往往已经取了数、只差提交。
  cancel-in-progress: false

jobs:
  files:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 「重新运行」会把那一拍原来的 commit 整份重放 —— 代码、脚本、四份档案都是当时的版本，
      # 采完之后那发 commit 挂在旧树上，而 main 这中间已经往前走了（本机推送 + 别的闹钟），
      # 四个档案两边都改过 → rebase 必冲突。11-21 16:12 那次红叉就是这么来的：
      # 那条 run 的 created_at 还是 12:30，attempt=2，head_sha 是 12:30 的树，
      # 所以日志里连当天中午才加进来的那一步都没有。
      # 先把本地分支挪到 main 最新，再开始采，重新运行和手点就等价了。
      - name: 跟着 main 最新档案
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git pull --rebase origin "$GITHUB_REF_NAME"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # continue-on-error：德塔文那台站点自己不稳定（HTTPS 握手不通、只能走 http），
      # 它红了不该让另外三家的档案一起停更。每一步各自把结果写在日志里。
      - name: 爱奇艺 · 更新时间表 + 预约
        continue-on-error: true
        run: node fetch_iqiyi.mjs

      - name: 德塔文 · 景气指数 + 付费力榜
        continue-on-error: true
        run: node fetch_detawen.mjs

      - name: 云合 · 榜与评级
        continue-on-error: true
        run: node fetch_yunhe.mjs

      # CVB 不在这里跑：www.cavbd.cn 只回境内 IP，机房 IP 是连接超时（11-21 实测
      # UND_ERR_CONNECT_TIMEOUT，Cloudflare 出口 522）。它搬到了青龙 —— 脚本 cvb_ljswr.js、
      # cron「两京十五日 · CVB 日榜（境内出口）」一天七拍，档案同样写这份 cvb.json。
      # 本机那份 fetch_cvb.mjs 留着，是手机不在家时在电脑上手补 cvb.json 的那份（读写本地文件）。

      # 抖音指数的回包是密文，钥匙写死在脚本里（两把 AES 钥匙按响应头 x-encrypted 选）。
      # 它只吃登录 cookie，不要 msToken / a_bogus —— 11-21 拿他登录着的页面真密文实测解通过。
      # 一天两拍里每一拍都跑：一次请求给 32 天，档案只按天累加，多跑不重复盖历史。
      - name: 抖音指数 · 综合指数 + 搜索指数
        continue-on-error: true
        env:
          DY_COOKIE: ${{ secrets.DY_COOKIE }}
        run: node fetch_douyin.mjs

      - name: 提交档案
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # cvb.json 不在清单里：那一份现在只有青龙写，这条工作流不碰它，两个写者不撞。
          git add -A iqiyi.json detawen.json yunhe.json douyin.json
          if git diff --cached --quiet; then
            echo "::notice::四份档案都没变化（多半是上游今天没出数），这一轮不提交"
            exit 0
          fi
          git commit -m "两京十五日档案 $(TZ=Asia/Shanghai date '+%F %H:%M')"
          n=0
          while [ "$n" -lt 4 ]; do
            n=$((n+1))
            if git pull --rebase origin "$GITHUB_REF_NAME" && git push; then
              echo "第 $n 次尝试推上去了"; exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 6 + 3))
          done
          echo "::error::四次都没挤进 main，这一轮不推（下一格接着试）"
          exit 1
